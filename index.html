      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem("on-view-theme");
        var dark =
          stored === "dark" ||
          (!stored &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
